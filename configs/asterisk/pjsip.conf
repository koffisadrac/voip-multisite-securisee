; pjsip.conf – Asterisk 20 (PJSIP), serveur SRV-ASTERISK 10.10.10.10
; Les 14 postes (101-107, 201-207) sont ajoutes a la fin par scripts/genere-postes.sh
; avec des mots de passe aleatoires : aucun secret n'est publie ici.

[global]
type=global
user_agent=abcServices-PBX

; Transport UDP du mode normal (port 5060 ferme dans UFW apres le passage en TLS)
[transport-udp]
type=transport
protocol=udp
bind=10.10.10.10:5060

; Transport TLS du mode chiffre (section 8.2) et marquage DSCP CS3 de la signalisation (volet C)
[transport-tls]
type=transport
protocol=tls
bind=10.10.10.10:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
tos=cs3

; ---- Modeles communs a tous les postes ----
[endpoint-base](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
direct_media=no
dtmf_mode=rfc4733
tos_audio=ef
; Mode chiffre : TLS et SRTP obligatoires
transport=transport-tls
media_encryption=sdes
media_encryption_optimistic=no

[auth-base](!)
type=auth
auth_type=userpass

[aor-base](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
