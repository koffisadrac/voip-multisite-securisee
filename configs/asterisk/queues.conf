; queues.conf – files d'attente 9000 (Longueuil) et 9001 (Montreal)

[general]
persistentmembers=yes
autofill=yes

[longueuil_queue]
strategy=rrmemory
musicclass=default
timeout=15
retry=5
wrapuptime=5
maxlen=0
announce-frequency=30
announce-position=yes
joinempty=yes
leavewhenempty=no
member => PJSIP/101
member => PJSIP/102
member => PJSIP/103
member => PJSIP/104
member => PJSIP/105
member => PJSIP/106
member => PJSIP/107

[montreal_queue]
strategy=rrmemory
musicclass=default
timeout=15
retry=5
wrapuptime=5
maxlen=0
announce-frequency=30
announce-position=yes
joinempty=yes
leavewhenempty=no
member => PJSIP/201
member => PJSIP/202
member => PJSIP/203
member => PJSIP/204
member => PJSIP/205
member => PJSIP/206
member => PJSIP/207
