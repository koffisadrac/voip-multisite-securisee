; extensions.conf – plan de numerotation

[general]
static=yes
writeprotect=no

[globals]
DUREE_SONNERIE=20
ACCUEIL=/var/lib/asterisk/custom/bienvenue

[from-internal]
; Postes des deux sites : 101-107 et 201-207
exten => _[12]0[1-7],1,NoOp(Appel de ${CALLERID(num)} vers ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},${DUREE_SONNERIE})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?occupe:absent)
 same => n(absent),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 same => n(occupe),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()

; Accueil Longueuil
exten => 9000,1,Answer()
 same => n,Wait(1)
 same => n,Playback(${ACCUEIL})
 same => n,Queue(longueuil_queue,,,,120)
 same => n,Hangup()

; Accueil Montreal
exten => 9001,1,Answer()
 same => n,Wait(1)
 same => n,Playback(${ACCUEIL})
 same => n,Queue(montreal_queue,,,,120)
 same => n,Hangup()

; Consulter sa messagerie vocale
exten => *98,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Enregistrer le message d'accueil
exten => *99,1,Answer()
 same => n,Playback(beep)
 same => n,Record(${ACCUEIL}.wav,3,30)
 same => n,Playback(${ACCUEIL})
 same => n,Hangup()
